<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080c" />
  <meta name="description" content="Ai-Buddy — an AI-powered study planner that turns your subjects, exams and deadlines into a realistic daily schedule." />
  <title>Ai-Buddy — Smart Study Planner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c6cff'/%3E%3Ctext x='16' y='23' font-size='18' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <div style="display:grid;place-items:center;min-height:100vh;gap:14px">
      <div class="brand-mark" style="width:52px;height:52px;border-radius:16px;font-size:22px;animation:pulse 1.6s ease-in-out infinite">S</div>
      <p class="muted small">Loading your planner…</p>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <div id="modal-root"></div>
  <style>@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}</style>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
